  <style>
    /* ══════════════════════════════════════════════════════════
       Martha Domínguez — digital card hub.
       Warm cream vintage-travel shell built to the approved
       reference mockup. Card artwork is production imagery,
       used exactly as delivered — no redrawing.
       ══════════════════════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { overflow-x: hidden; }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: #F4EEE3;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      position: relative;
      padding: 48px 24px 40px;
    }

    /* ── Decorative fragments — non-interactive, behind content ── */
    .decor {
      position: absolute;
      pointer-events: none;
      z-index: 0;
      opacity: 0.9;
    }
    .decor img { width: 100%; height: auto; display: block; }

    .decor--map-tl   { top: 0;    left: 0;    width: clamp(90px, 14vw, 170px); }
    .decor--plane-tr { top: 18px; right: 0;   width: clamp(120px, 18vw, 230px); }
    .decor--botanical-r { top: 34%; right: 0; width: clamp(80px, 11vw, 135px); }
    .decor--shells-l  { top: 46%; left: 0;    width: clamp(65px, 9vw, 110px); }
    .decor--postcard-r { bottom: 12%; right: 0; width: clamp(75px, 10vw, 125px); }
    .decor--map-br    { bottom: 0; right: 6%; width: clamp(65px, 9vw, 100px); }

    @media (max-width: 720px) {
      .decor--botanical-r, .decor--shells-l, .decor--postcard-r { display: none; }
    }
    @media (max-width: 480px) {
      .decor--map-tl, .decor--plane-tr, .decor--map-br { opacity: 0.55; }
    }

    .hub {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 880px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .monogram {
      width: 96px;
      height: auto;
      margin-bottom: 18px;
    }

    .name {
      font-family: 'EB Garamond', Georgia, serif;
      font-weight: 500;
      font-size: clamp(2.1rem, 6vw, 2.9rem);
      color: #38291F;
      letter-spacing: 0.3px;
      text-align: center;
      margin-bottom: 14px;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #B98B34;
      margin-bottom: 18px;
    }
    .divider::before,
    .divider::after {
      content: "";
      width: 46px;
      height: 1px;
      background: rgba(185,139,52,0.55);
    }
    .divider svg { width: 12px; height: 12px; }

    .eyebrow {
      font-family: 'EB Garamond', Georgia, serif;
      font-size: clamp(0.95rem, 2vw, 1.15rem);
      font-weight: 500;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: #B98B34;
      text-align: center;
      margin-bottom: 10px;
    }

    .tagline {
      font-family: 'EB Garamond', Georgia, serif;
      font-style: italic;
      font-size: clamp(0.95rem, 2.2vw, 1.15rem);
      color: #5C4A3A;
      text-align: center;
      margin-bottom: 40px;
    }

    .choices {
      display: flex;
      flex-direction: column;
      gap: 22px;
      width: 100%;
    }

    .choice {
      display: block;
      width: 100%;
      border-radius: 34px;
      overflow: hidden;
      line-height: 0;
      box-shadow: 0 14px 36px -16px rgba(56,41,31,0.35);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }
    .choice:hover {
      transform: translateY(-3px);
      box-shadow: 0 20px 44px -16px rgba(56,41,31,0.42);
    }
    .choice:active { transform: translateY(0); }
    .choice:focus-visible {
      outline: 3px solid #B98B34;
      outline-offset: 3px;
    }

    /* Equal visual tile system.
       Both choices share one outer aspect ratio so they read as a matched pair.
       No source image files are modified. */
    .choice {
      aspect-ratio: 879 / 380;
    }

    .choice img {
      width: 100%;
      max-width: none;
      border-radius: 34px;
    }

    /* Coordenada is naturally a little taller. Crop mostly from the quiet
       upper area, preserving the suitcase, compass/ticket and arrow. */
    .choice--cv img {
      height: 100%;
      object-fit: cover;
      object-position: center 76%;
    }

    /* Mercado Negro's final approved tile is delivered natively at
       879:380 — the same ratio as the shared tile aspect-ratio — so
       it renders normally with no crop compensation needed. */
    .choice--mn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Re-establish a clean common edge after the controlled crops. */
    .choice--cv,
    .choice--mn {
      border: 1px solid rgba(185, 139, 52, 0.32);
      background: #F4EEE3;
    }

    footer {
      position: relative;
      z-index: 1;
      margin-top: 48px;
      text-align: center;
      width: 100%;
    }

    .footer-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #B98B34;
      margin-bottom: 14px;
    }
    .footer-divider::before,
    .footer-divider::after {
      content: "";
      width: 46px;
      height: 1px;
      background: rgba(185,139,52,0.55);
    }
    .footer-divider svg { width: 12px; height: 12px; }

    footer a {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.68rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(56,41,31,0.55);
      transition: color 0.2s ease;
    }
    footer a:hover { color: rgba(56,41,31,0.85); }
  </style>
</head>
<body>

  <div class="decor decor--map-tl"><img src="hub-assets/decor/upper-left-vintage-map.webp" alt="" aria-hidden="true"></div>
  <div class="decor decor--plane-tr"><img src="hub-assets/decor/upper-right-plane-route.webp" alt="" aria-hidden="true"></div>
  <div class="decor decor--botanical-r"><img src="hub-assets/decor/right-botanical.webp" alt="" aria-hidden="true"></div>
  <div class="decor decor--shells-l"><img src="hub-assets/decor/left-shells-whisk.webp" alt="" aria-hidden="true"></div>
  <div class="decor decor--postcard-r"><img src="hub-assets/decor/right-coastal-postcard.webp" alt="" aria-hidden="true"></div>
  <div class="decor decor--map-br"><img src="hub-assets/decor/lower-right-map.webp" alt="" aria-hidden="true"></div>

  <div class="hub">

    <img class="monogram" src="hub-assets/brand/martha-md-monogram.webp" alt="">
    <h1 class="name">Martha Domínguez</h1>

    <div class="divider" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-10-9.3C.4 8.1 2.3 4 6.2 4c2.1 0 3.7 1.1 4.8 2.8C12.1 5.1 13.7 4 15.8 4c3.9 0 5.8 4.1 4.2 7.7C19.5 16.4 12 21 12 21z"/></svg>
    </div>

    <p class="eyebrow">Elige una tarjeta</p>
    <p class="tagline">Viajes que inspiran. Sabores que permanecen.</p>

    <div class="choices">

      <a class="choice choice--cv" href="./tarjeta-martha-cv.html" aria-label="Coordenada Viajes — ver tarjeta digital">
        <img
          src="hub-assets/cards/coordenada-viajes.webp"
          alt="Coordenada Viajes — Agencia de viajes"
          width="878" height="413"
        >
      </a>

      <a class="choice choice--mn" href="./tarjeta-martha-mn.html" aria-label="Mercado Negro — ver tarjeta digital">
        <img
          src="hub-assets/cards/mercado-negro.webp"
          alt="Mercado Negro — Pastelería y catering"
          width="879" height="380"
        >
      </a>

    </div>

  </div>

  <footer>
    <div class="footer-divider" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-10-9.3C.4 8.1 2.3 4 6.2 4c2.1 0 3.7 1.1 4.8 2.8C12.1 5.1 13.7 4 15.8 4c3.9 0 5.8 4.1 4.2 7.7C19.5 16.4 12 21 12 21z"/></svg>
    </div>
    <a href="https://www.eurekawebsites.tech/" target="_blank" rel="noopener noreferrer">
      POWERED BY EUREKA TECH
    </a>
  </footer>

</body>
</html>
