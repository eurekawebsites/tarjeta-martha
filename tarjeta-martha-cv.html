<head>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { overflow-x: hidden; }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #E8DFC8;
      padding: 24px 12px;
    }

    /* ===== Card shell =====
       Silhouette, texture, border, notches, divider, and corner ornament
       all come from the supplied card-background artwork — not CSS. */

    .card-cv {
      position: relative;
      width: min(calc(100vw - 24px), 430px);
      aspect-ratio: 984 / 1599;
      overflow: hidden;
      border-radius: 22px;
    }

    .card-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      z-index: 0;
      pointer-events: none;
    }

    .card-cv .content {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    /* ===== Header lockup =====
       Single finished image: London stamp, compass, Paris stamp,
       COORDENADA / Viajes, VIAJES QUE CONECTAN, AGENCIA DE VIAJES. */

    /* The header-lockup canvas carries transparent padding above/below its
       actual artwork (content occupies y 18%-84% of the 1122x1376 PNG).
       Sized/positioned so the artwork's visible content starts just below
       the card top and ends right above the divider baked into the
       card-background (measured at 40.5% of card height), not by the
       manifest's rough width estimate which ignored the padding. */
    .header-lockup {
      position: absolute;
      top: -7.25%;
      left: 0.85%;
      width: 75.35%;
    }

    /* ===== Lower stack =====
       Identity, contact rows, save button, and footer are laid out in
       normal flow inside one absolutely-positioned container that starts
       right below the divider baked into the card-background (measured at
       40.5% of card height). Flow layout (not four independently-guessed
       top:% zones) is what guarantees the four contact rows plus save
       button never overlap or overflow the card — their combined height is
       whatever it naturally is, not a fixed percentage guess. */
    .lower-stack {
      position: absolute;
      top: 41.5%;
      left: 0;
      width: 100%;
      bottom: 0;
      display: flex;
      flex-direction: column;
    }

    .identity {
      width: 84%;
      margin: 0 auto;
      text-align: center;
      flex-shrink: 0;
    }

    .identity .name {
      font-family: 'EB Garamond', Georgia, serif;
      font-weight: 600;
      font-size: clamp(1.1rem, 5.2vw, 1.35rem);
      color: var(--cv-dark-green);
      letter-spacing: 0.3px;
    }

    .identity .role {
      font-family: 'EB Garamond', Georgia, serif;
      font-weight: 500;
      font-size: clamp(0.66rem, 2.5vw, 0.76rem);
      letter-spacing: 2.2px;
      text-transform: uppercase;
      color: var(--cv-gold-hover);
      margin-top: 2px;
    }

    .identity .tagline {
      font-family: 'EB Garamond', Georgia, serif;
      font-style: italic;
      font-weight: 400;
      font-size: clamp(0.72rem, 2.9vw, 0.84rem);
      color: var(--cv-text);
      opacity: 0.9;
      margin-top: 3px;
    }

    .identity .flourish {
      width: 10%;
      height: auto;
      margin: 2px auto 0;
      opacity: 0.9;
    }

    /* ===== Contact stack ===== */

    .contact {
      width: 52%;
      margin: 0.8% auto 0;
      display: flex;
      flex-direction: column;
      gap: 0.3%;
      flex-shrink: 0;
    }

    .btn {
      position: relative;
      display: block;
      width: 100%;
      cursor: pointer;
      border: 0;
      background: none;
      padding: 0;
      text-align: left;
    }

    .btn-row-bg {
      display: block;
      width: 100%;
      height: auto;
    }

    .btn-inner {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      gap: 4.5%;
      padding: 0 5.5%;
    }

    .btn-icon {
      flex-shrink: 0;
      width: 19%;
      height: auto;
    }

    .btn-label {
      display: flex;
      flex-direction: column;
      gap: 1px;
      flex: 1;
      min-width: 0;
    }

    .btn-type {
      font-size: clamp(0.46rem, 1.6vw, 0.56rem);
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--cv-muted);
      font-weight: 700;
      font-family: Arial, Helvetica, sans-serif;
      white-space: nowrap;
    }

    .btn-value {
      font-family: 'EB Garamond', Georgia, serif;
      font-size: clamp(0.72rem, 2.9vw, 0.88rem);
      font-weight: 500;
      color: var(--cv-text);
      word-break: break-all;
    }

    /* ===== Save contact ===== */

    .btn-save-wrap {
      width: 58%;
      margin: 0.5% auto 0;
      flex-shrink: 0;
    }

    .btn-save {
      position: relative;
      display: block;
      width: 100%;
      cursor: pointer;
      border: 0;
      background: none;
      padding: 0;
    }

    .btn-save-bg {
      display: block;
      width: 100%;
      height: auto;
    }

    .btn-save-inner {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4%;
    }

    .btn-save-icon {
      width: 11%;
      height: auto;
    }

    .btn-save-text {
      font-family: 'EB Garamond', Georgia, serif;
      font-weight: 600;
      letter-spacing: 1.6px;
      font-size: clamp(0.78rem, 3.1vw, 0.92rem);
      text-transform: uppercase;
      color: var(--cv-gold);
      white-space: nowrap;
    }

    /* ===== Footer (inside card) ===== */

    .card-footer {
      width: 100%;
      text-align: center;
      margin-top: auto;
      padding-top: 0.2%;
      padding-bottom: 1.2%;
      flex-shrink: 0;
    }
    .card-footer a {
      display: inline-flex;
      align-items: center;
      font-size: clamp(0.5rem, 1.9vw, 0.6rem);
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(42,35,24,0.55);
      transition: color 0.2s;
      white-space: nowrap;
    }
    .card-footer a:hover { color: rgba(42,35,24,0.85); }
    .card-footer img {
      width: 12px;
      height: 12px;
      display: inline-block;
      vertical-align: -2px;
      margin-right: 5px;
    }
  </style>
</head>
<body>

  <div class="card-cv">
    <img class="card-bg" src="images/coordenada-card-v2/card-background.webp" alt="">

    <div class="content">

      <img class="header-lockup" src="images/coordenada-card-v2/header-lockup.webp" alt="Coordenada Viajes — Viajes que conectan — Agencia de Viajes">

      <div class="lower-stack">

      <div class="identity">
        <h1 class="name">Martha Domínguez</h1>
        <p class="role">Asesora de Viajes</p>
        <p class="tagline">Tu destino tiene una coordenada.</p>
        <img class="flourish" src="images/coordenada-card/webp-400/divider-starburst.webp" srcset="images/coordenada-card/webp-400/divider-starburst.webp 400w, images/coordenada-card/webp-800/divider-starburst.webp 800w" sizes="64px" alt="">
      </div>

      <div class="contact">

        <a class="btn" href="https://wa.me/5215517284050" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp +52 55 1728 4050">
          <img class="btn-row-bg" src="images/coordenada-card-v2/contact-row-bg.webp" alt="">
          <span class="btn-inner">
            <img class="btn-icon" src="images/coordenada-card-v2/icon-whatsapp.webp" alt="">
            <span class="btn-label">
              <span class="btn-type">WhatsApp</span>
              <span class="btn-value">+52 55 1728 4050</span>
            </span>
          </span>
        </a>

        <a class="btn" href="https://www.instagram.com/coordenada.viajes/" target="_blank" rel="noopener noreferrer" aria-label="Instagram @coordenada.viajes">
          <img class="btn-row-bg" src="images/coordenada-card-v2/contact-row-bg.webp" alt="">
          <span class="btn-inner">
            <img class="btn-icon" src="images/coordenada-card-v2/icon-instagram.webp" alt="">
            <span class="btn-label">
              <span class="btn-type">Instagram</span>
              <span class="btn-value">@coordenada.viajes</span>
            </span>
          </span>
        </a>

        <a class="btn" href="https://coordenadaviajes.com" target="_blank" rel="noopener noreferrer" aria-label="Sitio web coordenadaviajes.com">
          <img class="btn-row-bg" src="images/coordenada-card-v2/contact-row-bg.webp" alt="">
          <span class="btn-inner">
            <img class="btn-icon" src="images/coordenada-card-v2/icon-website.webp" alt="">
            <span class="btn-label">
              <span class="btn-type">Sitio web</span>
              <span class="btn-value">coordenadaviajes.com</span>
            </span>
          </span>
        </a>

        <button class="btn" onclick="copyClabeCV(this)" type="button" aria-label="Copiar CLABE interbancaria BBVA">
          <img class="btn-row-bg" src="images/coordenada-card-v2/contact-row-bg.webp" alt="">
          <span class="btn-inner">
            <img class="btn-icon" src="images/coordenada-card-v2/icon-bank.webp" alt="">
            <span class="btn-label">
              <span class="btn-type">Clabe interbancaria BBVA</span>
              <span class="btn-value" id="clabe-cv">012180015019864949</span>
            </span>
          </span>
        </button>

      </div>

      <div class="btn-save-wrap">
        <button class="btn-save" onclick="saveContactCV()" type="button" aria-label="Guardar contacto">
          <img class="btn-save-bg" src="images/coordenada-card-v2/save-contact-bg.webp" alt="">
          <span class="btn-save-inner">
            <img class="btn-save-icon" src="images/coordenada-card-v2/icon-save-contact.webp" alt="">
            <span class="btn-save-text">Guardar contacto</span>
          </span>
        </button>
      </div>

      <div class="card-footer">
        <a href="https://www.eurekawebsites.tech/" target="_blank" rel="noopener noreferrer">
          <img src="images/eureka/eureka-b-64.png" alt="">POWERED BY EUREKA TECH
        </a>
      </div>

      </div>
    </div>
  </div>

  <script>
    function copyClabeCV(btn) {
      navigator.clipboard.writeText('012180015019864949').then(function() {
        var el = btn.querySelector('#clabe-cv');
        var orig = el.textContent;
        el.textContent = '¡Copiado!';
        setTimeout(function() { el.textContent = orig; }, 2000);
      }).catch(function() {
        var range = document.createRange();
        range.selectNode(btn.querySelector('#clabe-cv'));
        window.getSelection().removeAllRanges();
        window.getSelection().addRange(range);
      });
    }

    function saveContactCV() {
      var vcard = [
        'BEGIN:VCARD',
        'VERSION:3.0',
        'FN:Martha Domínguez',
        'N:Domínguez;Martha;;;',
        'ORG:Coordenada Viajes',
        'TITLE:Asesora de Viajes',
        'TEL;TYPE=CELL,VOICE:+5215517284050',
        'URL:https://coordenadaviajes.com',
        'X-SOCIALPROFILE;type=instagram:https://www.instagram.com/coordenada.viajes/',
        'NOTE:CLABE BBVA: 012180015019864949',
        'END:VCARD'
      ].join('\r\n');
      var blob = new Blob([vcard], { type: 'text/vcard' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'Martha-Dominguez-Coordenada.vcf';
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>

</body>
