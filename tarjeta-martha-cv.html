<!DOCTYPE html>
<html lang="es">
<head>

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Martha Domínguez — Coordenada Viajes">
  <meta name="twitter:description" content="Asesora de Viajes · Viajes personalizados a cualquier rincón del mundo">
  <meta name="twitter:image" content="https://eurekawebsites.github.io/tarjeta-martha/images/brand/og-share-1200x630.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Playfair+Display:wght@600;700;800&family=Tangerine:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/brand-tokens.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { overflow-x: hidden; }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #E8DFC8;
      padding: 24px 12px;
    }

    /* ===== Card shell ===== */
    /* Background tones sampled directly from the approved mockup's paper
       (measured pixel colors, not an invented texture): open paper reads
       ~#F6EEE0–#F7EAD8, corners/edges darken toward ~#E0CCAE–#D2B58D. */

    .card-cv {
      position: relative;
      background:
        radial-gradient(ellipse 70% 55% at 50% 0%, rgba(247,234,216,0.9) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 8% 4%, rgba(228,206,172,0.85) 0%, transparent 55%),
        radial-gradient(ellipse 60% 50% at 94% 6%, rgba(224,204,174,0.8) 0%, transparent 55%),
        radial-gradient(ellipse 55% 45% at 6% 96%, rgba(210,181,141,0.75) 0%, transparent 55%),
        radial-gradient(ellipse 55% 45% at 96% 94%, rgba(212,180,132,0.7) 0%, transparent 55%),
        radial-gradient(ellipse 90% 70% at 50% 45%, #F6EEE0 0%, #EDDFC4 100%);
      color: var(--cv-text);
      width: min(calc(100vw - 24px), 430px);
      border-radius: 18px;
      border: 1px solid rgba(178,140,74,0.6);
      box-shadow: 0 1px 0 rgba(255,255,255,0.6) inset, 0 20px 48px rgba(42,35,24,0.22);
      overflow: hidden;
    }

    /* fine crack/fiber linework, matched to the mockup's visible paper grain */
    .card-cv::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.55;
      background-image:
        repeating-linear-gradient(113deg, rgba(150,118,64,0.07) 0px, rgba(150,118,64,0.07) 1px, transparent 1px, transparent 54px),
        repeating-linear-gradient(24deg, rgba(150,118,64,0.06) 0px, rgba(150,118,64,0.06) 1px, transparent 1px, transparent 68px),
        repeating-linear-gradient(-62deg, rgba(150,118,64,0.045) 0px, rgba(150,118,64,0.045) 1px, transparent 1px, transparent 82px);
      z-index: 0;
    }

    /* soft vignette pulling the corners darker, as measured in the approved reference */
    .card-cv::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 1;
      box-shadow: inset 0 0 70px rgba(122,94,48,0.16), inset 0 0 140px rgba(122,94,48,0.08);
      z-index: 0;
    }

    .card-cv .inner {
      position: relative;
      z-index: 1;
    }

    /* ticket notches at the mid divider */
    .card-cv .notch {
      position: absolute;
      top: 241px;
      width: 22px;
      height: 22px;
      background: #E8DFC8;
      border-radius: 50%;
      z-index: 2;
    }
    .card-cv .notch--l { left: -11px; }
    .card-cv .notch--r { right: -11px; }

    /* ===== Top branding =====
       Proportions measured from the approved mockup at 947px card width:
       London stamp d=170px (17.9%), Paris tag w=175px (18.5%), compass
       d=110px (11.6%), COORDENADA cap-height 50px (5.3%). Scaled to 430px. */

    .top {
      position: relative;
      padding: 22px 26px 16px;
      text-align: center;
    }

    .stamp {
      position: absolute;
    }
    .stamp--departed { top: 16px; left: 14px; width: 82px; }
    .stamp--paris { top: 12px; right: 16px; width: 78px; }

    .compass-top {
      width: 50px;
      height: 50px;
      margin: 2px auto 8px;
    }

    .brand-name {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 800;
      font-size: clamp(1.85rem, 9.2vw, 2.3rem);
      letter-spacing: 0.4px;
      color: var(--cv-dark-green);
      line-height: 1.05;
    }

    .brand-script {
      font-family: 'Tangerine', 'EB Garamond', cursive, serif;
      font-weight: 700;
      font-size: clamp(2.9rem, 13.5vw, 3.5rem);
      color: var(--cv-dark-green);
      line-height: 0.8;
      margin-top: -6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    .brand-script::before,
    .brand-script::after {
      content: "";
      height: 1px;
      width: 34px;
      background: var(--cv-gold);
      opacity: 0.8;
    }

    .brand-sub {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.74rem;
      letter-spacing: 3.5px;
      text-transform: uppercase;
      color: var(--cv-text);
      opacity: 0.75;
      margin-top: 6px;
    }

    .agency-badge {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-top: 12px;
      padding: 8px 24px;
      border-radius: 20px;
      background: var(--cv-dark-green);
      border: 1px solid var(--cv-gold);
      color: var(--cv-gold);
      font-family: 'EB Garamond', Georgia, serif;
      font-weight: 600;
      font-size: 0.8rem;
      letter-spacing: 2.8px;
      text-transform: uppercase;
    }
    .agency-badge .dot { opacity: 0.7; }

    /* ===== Divider ===== */

    .divider {
      position: relative;
      height: 1px;
      margin: 4px 22px 0;
      border-top: 2px dotted rgba(45,80,22,0.35);
    }

    /* ===== Identity block ===== */

    .identity {
      text-align: center;
      padding: 16px 26px 2px;
    }

    .identity .name {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 700;
      font-size: clamp(1.6rem, 7.4vw, 1.95rem);
      color: var(--cv-dark-green);
      letter-spacing: 0.3px;
    }

    .identity .role {
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 700;
      font-size: 0.82rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--cv-gold-hover);
      margin-top: 5px;
    }

    .identity .tagline {
      font-family: 'EB Garamond', Georgia, serif;
      font-style: italic;
      font-size: 1.08rem;
      color: var(--cv-text);
      opacity: 0.9;
      margin-top: 10px;
    }

    .identity .flourish {
      width: 68px;
      height: auto;
      margin: 10px auto 0;
      opacity: 0.9;
    }

    /* ===== Contact rows ===== */

    .contact {
      padding: 12px 26px 16px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 9px 16px;
      border-radius: 8px;
      font-family: Arial, Helvetica, sans-serif;
      background: rgba(251,247,236,0.55);
      border: 1px solid rgba(178,140,74,0.4);
      box-shadow: 0 1px 0 rgba(255,255,255,0.5) inset, 0 1px 3px rgba(94,68,28,0.06);
      color: var(--cv-text);
      cursor: pointer;
      width: 100%;
      text-align: left;
      transition: border-color 0.18s ease, transform 0.1s ease, box-shadow 0.18s ease;
    }
    .btn:hover {
      border-color: var(--cv-gold);
      transform: translateY(-1px);
      box-shadow: 0 1px 0 rgba(255,255,255,0.5) inset, 0 4px 10px rgba(94,68,28,0.1);
    }

    .btn-icon {
      flex-shrink: 0;
      width: 34px;
      height: 34px;
      border-radius: 7px;
    }

    .btn-label {
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex: 1;
      min-width: 0;
    }

    .btn-type {
      font-size: 0.64rem;
      letter-spacing: 1.9px;
      text-transform: uppercase;
      color: var(--cv-muted);
      font-weight: 700;
    }

    .btn-value {
      font-family: 'EB Garamond', Georgia, serif;
      font-size: 1.06rem;
      font-weight: 500;
      color: var(--cv-text);
      word-break: break-all;
    }

    /* ===== Save button — Option 2 ticket/plaque style ===== */

    .btn-save-wrap {
      margin-top: 2px;
      padding: 0 2px;
    }

    .btn-save {
      justify-content: center;
      gap: 14px;
      padding: 12px 18px;
      background: linear-gradient(180deg, #24451A 0%, var(--cv-dark-green) 100%);
      border: 1px solid var(--cv-gold);
      box-shadow: 0 1px 0 rgba(255,255,255,0.08) inset, 0 6px 18px rgba(30,58,15,0.28);
      color: var(--cv-gold);
      font-family: 'EB Garamond', Georgia, serif;
      font-weight: 600;
      letter-spacing: 2.8px;
      font-size: 1.02rem;
      text-transform: uppercase;
      position: relative;
      /* ticket/plaque silhouette: notched corners cut into the shape */
      clip-path: polygon(
        14px 0, calc(100% - 14px) 0, 100% 14px,
        100% calc(100% - 14px), calc(100% - 14px) 100%,
        14px 100%, 0 calc(100% - 14px), 0 14px
      );
    }
    .btn-save:hover {
      border-color: #E4C876;
      transform: translateY(-1px);
      box-shadow: 0 1px 0 rgba(255,255,255,0.08) inset, 0 8px 22px rgba(30,58,15,0.34);
    }
    .btn-save::before,
    .btn-save::after {
      content: "";
      position: absolute;
      top: 7px;
      bottom: 7px;
      width: 1px;
      background: rgba(201,168,76,0.55);
    }
    .btn-save::before { left: 11px; }
    .btn-save::after { right: 11px; }
    .btn-save .btn-icon { width: 27px; height: 27px; border-radius: 0; }

    /* ===== Corner map accent ===== */

    .map-accent {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 108px;
      height: 108px;
      opacity: 0.18;
      pointer-events: none;
      z-index: 0;
    }

    /* ===== Footer (inside card) ===== */

    .card-footer {
      text-align: center;
      padding: 2px 20px 16px;
      position: relative;
      z-index: 1;
    }
    .card-footer a {
      display: inline-flex;
      align-items: center;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(42,35,24,0.5);
      transition: color 0.2s;
    }
    .card-footer a:hover { color: rgba(42,35,24,0.8); }
    .card-footer img {
      width: 14px;
      height: 14px;
      display: inline-block;
      vertical-align: -3px;
      margin-right: 6px;
    }
  </style>
</head>
<body>

  <div class="card-cv">
    <div class="notch notch--l"></div>
    <div class="notch notch--r"></div>

    <div class="inner">

      <div class="top">

        <img class="stamp stamp--departed" src="images/coordenada-card/webp-400/stamp-london.webp" srcset="images/coordenada-card/webp-400/stamp-london.webp 400w, images/coordenada-card/webp-800/stamp-london.webp 800w" sizes="92px" alt="">

        <img class="stamp stamp--paris" src="images/coordenada-card/webp-400/stamp-paris.webp" srcset="images/coordenada-card/webp-400/stamp-paris.webp 400w, images/coordenada-card/webp-800/stamp-paris.webp 800w" sizes="64px" alt="">

        <img class="compass-top" src="images/coordenada-card/webp-400/compass-top.webp" srcset="images/coordenada-card/webp-400/compass-top.webp 400w, images/coordenada-card/webp-800/compass-top.webp 800w" sizes="46px" alt="">

        <h1 class="brand-name">COORDENADA</h1>
        <p class="brand-script">Viajes</p>
        <p class="brand-sub">Viajes que conectan</p>

        <div class="agency-badge">
          <span class="dot">•</span> Agencia de Viajes <span class="dot">•</span>
        </div>

      </div>

      <div class="divider"></div>

      <div class="identity">
        <h2 class="name">Martha Domínguez</h2>
        <p class="role">Asesora de Viajes</p>
        <p class="tagline">Tu destino tiene una coordenada.</p>
        <img class="flourish" src="images/coordenada-card/webp-400/divider-starburst.webp" srcset="images/coordenada-card/webp-400/divider-starburst.webp 400w, images/coordenada-card/webp-800/divider-starburst.webp 800w" sizes="64px" alt="">
      </div>

      <div class="contact">

        <a class="btn" href="https://wa.me/5215517284050" target="_blank" rel="noopener noreferrer">
          <img class="btn-icon" src="images/coordenada-card/webp-400/icon-whatsapp.webp" srcset="images/coordenada-card/webp-400/icon-whatsapp.webp 400w, images/coordenada-card/webp-800/icon-whatsapp.webp 800w" sizes="40px" alt="">
          <span class="btn-label">
            <span class="btn-type">WhatsApp</span>
            <span class="btn-value">+52 55 1728 4050</span>
          </span>
        </a>

        <a class="btn" href="https://www.instagram.com/coordenada.viajes/" target="_blank" rel="noopener noreferrer">
          <img class="btn-icon" src="images/coordenada-card/webp-400/icon-instagram.webp" srcset="images/coordenada-card/webp-400/icon-instagram.webp 400w, images/coordenada-card/webp-800/icon-instagram.webp 800w" sizes="40px" alt="">
          <span class="btn-label">
            <span class="btn-type">Instagram</span>
            <span class="btn-value">@coordenada.viajes</span>
          </span>
        </a>

        <a class="btn" href="https://coordenadaviajes.com" target="_blank" rel="noopener noreferrer">
          <img class="btn-icon" src="images/coordenada-card/webp-400/icon-website.webp" srcset="images/coordenada-card/webp-400/icon-website.webp 400w, images/coordenada-card/webp-800/icon-website.webp 800w" sizes="40px" alt="">
          <span class="btn-label">
            <span class="btn-type">Sitio web</span>
            <span class="btn-value">coordenadaviajes.com</span>
          </span>
        </a>

        <button class="btn" onclick="copyClabeCV(this)" type="button">
          <img class="btn-icon" src="images/coordenada-card/webp-400/icon-bank.webp" srcset="images/coordenada-card/webp-400/icon-bank.webp 400w, images/coordenada-card/webp-800/icon-bank.webp 800w" sizes="40px" alt="">
          <span class="btn-label">
            <span class="btn-type">Clabe interbancaria BBVA</span>
            <span class="btn-value" id="clabe-cv">012180015019864949</span>
          </span>
        </button>

        <div class="btn-save-wrap">
          <button class="btn btn-save" onclick="saveContactCV()" type="button">
            <img class="btn-icon" src="images/coordenada-card/webp-400/icon-save-contact.webp" srcset="images/coordenada-card/webp-400/icon-save-contact.webp 400w, images/coordenada-card/webp-800/icon-save-contact.webp 800w" sizes="26px" alt="">
            Guardar contacto
          </button>
        </div>

      </div>

      <!-- subtle compass/map ornament, lower right -->
      <img class="map-accent" src="images/coordenada-card/webp-400/compass-corner.webp" srcset="images/coordenada-card/webp-400/compass-corner.webp 400w, images/coordenada-card/webp-800/compass-corner.webp 800w" sizes="96px" alt="">

      <div class="card-footer">
        <a href="https://www.eurekawebsites.tech/" target="_blank" rel="noopener noreferrer">
          <img src="images/eureka/eureka-b-64.png" alt="">POWERED BY EUREKA TECH
        </a>
      </div>

    </div>
  </div>

  <script>
    function copyClabeCV(btn) {
      navigator.clipboard.writeText('012180015019864949').then(function() {
        var el = btn.querySelector('#clabe-cv');
        var orig = el.textContent;
        el.textContent = '¡Copiado!';
        setTimeout(function() { el.textContent = orig; }, 2000);
      }).catch(function() {
        var range = document.createRange();
        range.selectNode(btn.querySelector('#clabe-cv'));
        window.getSelection().removeAllRanges();
        window.getSelection().addRange(range);
      });
    }

    function saveContactCV() {
      var vcard = [
        'BEGIN:VCARD',
        'VERSION:3.0',
        'FN:Martha Domínguez',
        'N:Domínguez;Martha;;;',
        'ORG:Coordenada Viajes',
        'TITLE:Asesora de Viajes',
        'TEL;TYPE=CELL,VOICE:+5215517284050',
        'URL:https://coordenadaviajes.com',
        'X-SOCIALPROFILE;type=instagram:https://www.instagram.com/coordenada.viajes/',
        'NOTE:CLABE BBVA: 012180015019864949',
        'END:VCARD'
      ].join('\r\n');
      var blob = new Blob([vcard], { type: 'text/vcard' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'Martha-Dominguez-Coordenada.vcf';
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>

</body>
</html>
