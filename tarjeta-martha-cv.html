<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="icons/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/coordenada-icon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/coordenada-icon-180.png">
  <meta name="theme-color" content="#F5EFDF">
  <title>Martha Domínguez — Coordenada Viajes</title>
  <meta name="description" content="Asesora de Viajes · Viajes personalizados a cualquier rincón del mundo">
  <meta property="og:type" content="profile">
  <meta property="og:title" content="Martha Domínguez — Coordenada Viajes">
  <meta property="og:description" content="Asesora de Viajes · Viajes personalizados a cualquier rincón del mundo">
  <meta property="og:image" content="https://eurekawebsites.github.io/tarjeta-martha/images/brand/og-share-1200x630.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://eurekawebsites.github.io/tarjeta-martha/tarjeta-martha-cv.html">
  <meta property="og:site_name" content="Coordenada Viajes">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Martha Domínguez — Coordenada Viajes">
  <meta name="twitter:description" content="Asesora de Viajes · Viajes personalizados a cualquier rincón del mundo">
  <meta name="twitter:image" content="https://eurekawebsites.github.io/tarjeta-martha/images/brand/og-share-1200x630.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Playfair+Display:wght@600;700;800&family=Tangerine:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/brand-tokens.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { overflow-x: hidden; }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #E8DFC8;
      padding: 24px 12px;
    }

    /* ===== Card shell ===== */

    .card-cv {
      position: relative;
      background:
        radial-gradient(ellipse at 12% 8%, rgba(201,168,76,0.10), transparent 40%),
        radial-gradient(ellipse at 88% 92%, rgba(45,80,22,0.07), transparent 45%),
        #F5EFDF;
      color: var(--cv-text);
      width: min(calc(100vw - 24px), 430px);
      border-radius: 18px;
      border: 1px solid rgba(201,168,76,0.55);
      box-shadow: 0 1px 0 rgba(255,255,255,0.6) inset, 0 14px 40px rgba(42,35,24,0.16);
      overflow: hidden;
    }

    /* subtle vintage map/paper texture, drawn purely in CSS (no external texture asset supplied) */
    .card-cv::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.6;
      background-image:
        radial-gradient(circle at 20% 15%, rgba(170,138,74,0.14) 0, transparent 22%),
        radial-gradient(circle at 80% 10%, rgba(170,138,74,0.11) 0, transparent 18%),
        radial-gradient(circle at 15% 60%, rgba(170,138,74,0.12) 0, transparent 20%),
        radial-gradient(circle at 85% 55%, rgba(170,138,74,0.1) 0, transparent 24%),
        radial-gradient(circle at 50% 85%, rgba(170,138,74,0.12) 0, transparent 26%),
        repeating-linear-gradient(115deg, rgba(120,100,60,0.05) 0px, rgba(120,100,60,0.05) 1px, transparent 1px, transparent 90px),
        repeating-linear-gradient(25deg, rgba(120,100,60,0.04) 0px, rgba(120,100,60,0.04) 1px, transparent 1px, transparent 110px);
      z-index: 0;
    }

    .card-cv .inner {
      position: relative;
      z-index: 1;
    }

    /* ticket notches at the mid divider */
    .card-cv .notch {
      position: absolute;
      top: 232px;
      width: 22px;
      height: 22px;
      background: #E8DFC8;
      border-radius: 50%;
      z-index: 2;
    }
    .card-cv .notch--l { left: -11px; }
    .card-cv .notch--r { right: -11px; }

    /* ===== Top branding ===== */

    .top {
      position: relative;
      padding: 26px 92px 20px;
      text-align: center;
    }

    .stamp {
      position: absolute;
    }
    .stamp--departed { top: 14px; left: 10px; width: 92px; }
    .stamp--paris { top: 10px; right: 10px; width: 64px; }

    .compass-top {
      width: 46px;
      height: 46px;
      margin: 0 auto 8px;
    }

    .brand-name {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 800;
      font-size: clamp(1.5rem, 8vw, 1.9rem);
      letter-spacing: 0.3px;
      color: var(--cv-dark-green);
      line-height: 1.05;
    }

    .brand-script {
      font-family: 'Tangerine', 'EB Garamond', cursive, serif;
      font-weight: 700;
      font-size: clamp(2.5rem, 12vw, 3rem);
      color: var(--cv-dark-green);
      line-height: 1;
      margin-top: -4px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .brand-script::before,
    .brand-script::after {
      content: "";
      height: 1px;
      width: 26px;
      background: var(--cv-gold);
      opacity: 0.8;
    }

    .brand-sub {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.68rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--cv-text);
      opacity: 0.75;
      margin-top: 6px;
    }

    .agency-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      padding: 8px 20px;
      border-radius: 20px;
      background: var(--cv-dark-green);
      border: 1px solid var(--cv-gold);
      color: var(--cv-gold);
      font-family: 'EB Garamond', Georgia, serif;
      font-weight: 600;
      font-size: 0.75rem;
      letter-spacing: 2.5px;
      text-transform: uppercase;
    }
    .agency-badge .dot { opacity: 0.7; }

    /* ===== Divider ===== */

    .divider {
      position: relative;
      height: 1px;
      margin: 4px 22px 0;
      border-top: 2px dotted rgba(45,80,22,0.35);
    }

    /* ===== Identity block ===== */

    .identity {
      text-align: center;
      padding: 22px 24px 6px;
    }

    .identity .name {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 700;
      font-size: clamp(1.4rem, 6.5vw, 1.7rem);
      color: var(--cv-dark-green);
      letter-spacing: 0.4px;
    }

    .identity .role {
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 700;
      font-size: 0.76rem;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--cv-gold-hover);
      margin-top: 6px;
    }

    .identity .tagline {
      font-family: 'EB Garamond', Georgia, serif;
      font-style: italic;
      font-size: 1rem;
      color: var(--cv-text);
      opacity: 0.88;
      margin-top: 12px;
    }

    .identity .flourish {
      width: 64px;
      height: auto;
      margin: 12px auto 0;
      opacity: 0.9;
    }

    /* ===== Contact rows ===== */

    .contact {
      padding: 18px 22px 22px;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 11px 14px;
      border-radius: 6px;
      font-family: Arial, Helvetica, sans-serif;
      background: #FBF8F0;
      border: 1px solid rgba(45,80,22,0.22);
      color: var(--cv-text);
      cursor: pointer;
      width: 100%;
      text-align: left;
      transition: border-color 0.18s ease, transform 0.1s ease;
    }
    .btn:hover { border-color: var(--cv-gold); transform: translateY(-1px); }

    .btn-icon {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      border-radius: 6px;
    }

    .btn-label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
      min-width: 0;
    }

    .btn-type {
      font-size: 0.62rem;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: var(--cv-muted);
      font-weight: 700;
    }

    .btn-value {
      font-family: 'EB Garamond', Georgia, serif;
      font-size: 1.02rem;
      font-weight: 500;
      color: var(--cv-text);
      word-break: break-all;
    }

    /* ===== Save button — Option 2 ticket/plaque style ===== */

    .btn-save-wrap {
      margin-top: 4px;
      padding: 0 4px;
    }

    .btn-save {
      justify-content: center;
      gap: 12px;
      padding: 14px 16px;
      background: var(--cv-dark-green);
      border: 1px solid var(--cv-gold);
      color: var(--cv-gold);
      font-family: 'EB Garamond', Georgia, serif;
      font-weight: 600;
      letter-spacing: 2.5px;
      font-size: 0.98rem;
      text-transform: uppercase;
      position: relative;
      /* ticket/plaque silhouette: notched corners cut into the shape */
      clip-path: polygon(
        12px 0, calc(100% - 12px) 0, 100% 12px,
        100% calc(100% - 12px), calc(100% - 12px) 100%,
        12px 100%, 0 calc(100% - 12px), 0 12px
      );
    }
    .btn-save:hover { border-color: #E4C876; transform: translateY(-1px); }
    .btn-save::before,
    .btn-save::after {
      content: "";
      position: absolute;
      top: 6px;
      bottom: 6px;
      width: 1px;
      background: rgba(201,168,76,0.5);
    }
    .btn-save::before { left: 9px; }
    .btn-save::after { right: 9px; }
    .btn-save .btn-icon { width: 26px; height: 26px; border-radius: 0; }

    /* ===== Corner map accent ===== */

    .map-accent {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 96px;
      height: 96px;
      opacity: 0.14;
      pointer-events: none;
      z-index: 0;
    }

    /* ===== Footer (inside card) ===== */

    .card-footer {
      text-align: center;
      padding: 4px 20px 22px;
      position: relative;
      z-index: 1;
    }
    .card-footer a {
      display: inline-flex;
      align-items: center;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(42,35,24,0.5);
      transition: color 0.2s;
    }
    .card-footer a:hover { color: rgba(42,35,24,0.8); }
    .card-footer img {
      width: 14px;
      height: 14px;
      display: inline-block;
      vertical-align: -3px;
      margin-right: 6px;
    }
  </style>
</head>
<body>

  <div class="card-cv">
    <div class="notch notch--l"></div>
    <div class="notch notch--r"></div>

    <div class="inner">

      <div class="top">

        <img class="stamp stamp--departed" src="images/coordenada-card/webp-400/stamp-london.webp" srcset="images/coordenada-card/webp-400/stamp-london.webp 400w, images/coordenada-card/webp-800/stamp-london.webp 800w" sizes="92px" alt="">

        <img class="stamp stamp--paris" src="images/coordenada-card/webp-400/stamp-paris.webp" srcset="images/coordenada-card/webp-400/stamp-paris.webp 400w, images/coordenada-card/webp-800/stamp-paris.webp 800w" sizes="64px" alt="">

        <img class="compass-top" src="images/coordenada-card/webp-400/compass-top.webp" srcset="images/coordenada-card/webp-400/compass-top.webp 400w, images/coordenada-card/webp-800/compass-top.webp 800w" sizes="46px" alt="">

        <h1 class="brand-name">COORDENADA</h1>
        <p class="brand-script">Viajes</p>
        <p class="brand-sub">Viajes que conectan</p>

        <div class="agency-badge">
          <span class="dot">•</span> Agencia de Viajes <span class="dot">•</span>
        </div>

      </div>

      <div class="divider"></div>

      <div class="identity">
        <h2 class="name">Martha Domínguez</h2>
        <p class="role">Asesora de Viajes</p>
        <p class="tagline">Tu destino tiene una coordenada.</p>
        <img class="flourish" src="images/coordenada-card/webp-400/divider-starburst.webp" srcset="images/coordenada-card/webp-400/divider-starburst.webp 400w, images/coordenada-card/webp-800/divider-starburst.webp 800w" sizes="64px" alt="">
      </div>

      <div class="contact">

        <a class="btn" href="https://wa.me/5215517284050" target="_blank" rel="noopener noreferrer">
          <img class="btn-icon" src="images/coordenada-card/webp-400/icon-whatsapp.webp" srcset="images/coordenada-card/webp-400/icon-whatsapp.webp 400w, images/coordenada-card/webp-800/icon-whatsapp.webp 800w" sizes="40px" alt="">
          <span class="btn-label">
            <span class="btn-type">WhatsApp</span>
            <span class="btn-value">+52 55 1728 4050</span>
          </span>
        </a>

        <a class="btn" href="https://www.instagram.com/coordenada.viajes/" target="_blank" rel="noopener noreferrer">
          <img class="btn-icon" src="images/coordenada-card/webp-400/icon-instagram.webp" srcset="images/coordenada-card/webp-400/icon-instagram.webp 400w, images/coordenada-card/webp-800/icon-instagram.webp 800w" sizes="40px" alt="">
          <span class="btn-label">
            <span class="btn-type">Instagram</span>
            <span class="btn-value">@coordenada.viajes</span>
          </span>
        </a>

        <a class="btn" href="https://coordenadaviajes.com" target="_blank" rel="noopener noreferrer">
          <img class="btn-icon" src="images/coordenada-card/webp-400/icon-website.webp" srcset="images/coordenada-card/webp-400/icon-website.webp 400w, images/coordenada-card/webp-800/icon-website.webp 800w" sizes="40px" alt="">
          <span class="btn-label">
            <span class="btn-type">Sitio web</span>
            <span class="btn-value">coordenadaviajes.com</span>
          </span>
        </a>

        <button class="btn" onclick="copyClabeCV(this)" type="button">
          <img class="btn-icon" src="images/coordenada-card/webp-400/icon-bank.webp" srcset="images/coordenada-card/webp-400/icon-bank.webp 400w, images/coordenada-card/webp-800/icon-bank.webp 800w" sizes="40px" alt="">
          <span class="btn-label">
            <span class="btn-type">Clabe interbancaria BBVA</span>
            <span class="btn-value" id="clabe-cv">012180015019864949</span>
          </span>
        </button>

        <div class="btn-save-wrap">
          <button class="btn btn-save" onclick="saveContactCV()" type="button">
            <img class="btn-icon" src="images/coordenada-card/webp-400/icon-save-contact.webp" srcset="images/coordenada-card/webp-400/icon-save-contact.webp 400w, images/coordenada-card/webp-800/icon-save-contact.webp 800w" sizes="26px" alt="">
            Guardar contacto
          </button>
        </div>

      </div>

      <!-- subtle compass/map ornament, lower right -->
      <img class="map-accent" src="images/coordenada-card/webp-400/compass-corner.webp" srcset="images/coordenada-card/webp-400/compass-corner.webp 400w, images/coordenada-card/webp-800/compass-corner.webp 800w" sizes="96px" alt="">

      <div class="card-footer">
        <a href="https://www.eurekawebsites.tech/" target="_blank" rel="noopener noreferrer">
          <img src="images/eureka/eureka-b-64.png" alt="">POWERED BY EUREKA TECH
        </a>
      </div>

    </div>
  </div>

  <script>
    function copyClabeCV(btn) {
      navigator.clipboard.writeText('012180015019864949').then(function() {
        var el = btn.querySelector('#clabe-cv');
        var orig = el.textContent;
        el.textContent = '¡Copiado!';
        setTimeout(function() { el.textContent = orig; }, 2000);
      }).catch(function() {
        var range = document.createRange();
        range.selectNode(btn.querySelector('#clabe-cv'));
        window.getSelection().removeAllRanges();
        window.getSelection().addRange(range);
      });
    }

    function saveContactCV() {
      var vcard = [
        'BEGIN:VCARD',
        'VERSION:3.0',
        'FN:Martha Domínguez',
        'N:Domínguez;Martha;;;',
        'ORG:Coordenada Viajes',
        'TITLE:Asesora de Viajes',
        'TEL;TYPE=CELL,VOICE:+5215517284050',
        'URL:https://coordenadaviajes.com',
        'X-SOCIALPROFILE;type=instagram:https://www.instagram.com/coordenada.viajes/',
        'NOTE:CLABE BBVA: 012180015019864949',
        'END:VCARD'
      ].join('\r\n');
      var blob = new Blob([vcard], { type: 'text/vcard' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'Martha-Dominguez-Coordenada.vcf';
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>

</body>
</html>
