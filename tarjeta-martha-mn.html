  <style>
    /* ══════════════════════════════════════════════════════════
       Mercado Negro digital card — approved brand pass.
       Charcoal / chocolate / antique gold / cream, restrained
       dusty rose. Primary mark = supplied round-seal + script
       "Mercado Negro" + "BY MARTHA DOMÍNGUEZ" lockup — used as
       delivered, not redrawn. See brand/ and css/mn-brand-tokens.css.
       ══════════════════════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { overflow-x: hidden; }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      font-family: var(--mn-sans);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      background:
        radial-gradient(ellipse 70% 50% at 50% 0%, rgba(201,168,118,0.06) 0%, transparent 55%),
        linear-gradient(175deg, var(--mn-charcoal-2) 0%, var(--mn-charcoal) 100%);
      padding: 28px 20px 36px;
    }

    .card-mn {
      background: var(--mn-charcoal-2);
      color: var(--mn-cream);
      width: 100%;
      max-width: 420px;
      border-radius: var(--mn-radius);
      border: 1px solid var(--mn-border);
      overflow: hidden;
      box-shadow: var(--mn-shadow-card);
    }

    .card-mn .top {
      background: linear-gradient(160deg, var(--mn-chocolate) 0%, var(--mn-charcoal-2) 100%);
      padding: 34px 28px 26px;
      text-align: center;
      border-bottom: 1px solid var(--mn-border);
    }

    /* Primary brand mark — supplied lockup: round seal + script
       "Mercado Negro" + gold "BY MARTHA DOMÍNGUEZ" byline, used as
       one image exactly as delivered. */
    .card-mn .lockup {
      width: 100%;
      max-width: 260px;
      height: auto;
      margin: 0 auto 18px;
    }

    .card-mn .descriptor {
      font-family: var(--mn-sans);
      font-size: 0.68rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--mn-gold);
      margin-bottom: 14px;
    }

    .card-mn .tagline {
      font-family: var(--mn-serif-italic);
      font-style: italic;
      font-size: 0.92rem;
      color: var(--mn-cream-muted);
      line-height: 1.5;
    }

    .card-mn .strip {
      background: var(--mn-charcoal);
      padding: 11px 20px;
      text-align: center;
      font-family: var(--mn-sans);
      font-weight: 700;
      font-size: 0.62rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--mn-gold);
      border-top: 1px solid var(--mn-border);
      border-bottom: 1px solid var(--mn-border);
      white-space: normal;
      line-height: 1.8;
    }

    .card-mn .contact {
      padding: 20px 22px 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: var(--mn-charcoal-2);
    }

    .card-mn .btn {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 13px 16px;
      border-radius: var(--mn-radius-sm);
      font-family: var(--mn-sans);
      font-size: 0.85rem;
      transition: opacity 0.18s ease, transform 0.1s ease, border-color 0.18s ease;
      background: var(--mn-charcoal);
      border: 1px solid var(--mn-border);
      color: var(--mn-cream);
      cursor: pointer;
      width: 100%;
      text-align: left;
    }

    .card-mn .btn:hover { opacity: 0.85; transform: translateY(-1px); border-color: var(--mn-gold-dim); }
    .card-mn .btn:active { transform: translateY(0); }
    .card-mn .btn:focus-visible {
      outline: 2px solid var(--mn-gold);
      outline-offset: 2px;
    }

    .card-mn .btn-icon { width: 22px; height: 22px; flex-shrink: 0; }

    .card-mn .btn-label {
      display: flex;
      flex-direction: column;
      gap: 1px;
      flex: 1;
      min-width: 0;
    }

    .card-mn .btn-type {
      font-size: 0.58rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--mn-gold);
      opacity: 0.85;
      font-weight: 700;
      font-family: var(--mn-sans);
    }

    .card-mn .btn-value {
      font-family: var(--mn-sans);
      font-size: 0.9rem;
      color: var(--mn-cream);
      word-break: break-all;
    }

    /* Primary action — restrained dusty rose, per brand hierarchy */
    .card-mn .btn-save {
      background: var(--mn-rose);
      border: 1px solid var(--mn-rose);
      color: var(--mn-cream);
      justify-content: center;
      gap: 10px;
      font-family: var(--mn-serif);
      font-weight: 500;
      letter-spacing: 2px;
      font-size: 0.85rem;
      text-transform: uppercase;
    }
    .card-mn .btn-save:hover { opacity: 0.88; background: var(--mn-rose); }
  </style>
</head>
<body>

  <div class="card-mn">

    <div class="top">
      <img
        class="lockup"
        src="brand/logo/mercado-negro-primary-lockup-cream-gold-transparent-1600.webp"
        alt="Mercado Negro — by Martha Domínguez"
        width="1600" height="1047"
      >

      <p class="descriptor">Pastelería &amp; Catering</p>
      <p class="tagline">Detalles que se saborean.<br>Momentos que permanecen.</p>
    </div>

    <div class="strip">
      Repostería &nbsp;·&nbsp; Catering &nbsp;·&nbsp; Chef para eventos
    </div>

    <div class="contact">

      <a class="btn" href="https://wa.me/5215517284050" target="_blank" rel="noopener noreferrer">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="#C9A876" xmlns="http://www.w3.org/2000/svg">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
        </svg>
        <span class="btn-label">
          <span class="btn-type">WhatsApp</span>
          <span class="btn-value">+52 55 1728 4050</span>
        </span>
      </a>

      <a class="btn" href="https://www.instagram.com/mercadonegrobymarthadominguez" target="_blank" rel="noopener noreferrer">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="#C9A876" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
          <circle cx="12" cy="12" r="4"/>

        </svg>
        <span class="btn-label">
          <span class="btn-type">Instagram</span>
          <span class="btn-value">@mercadonegrobymarthadominguez</span>
        </span>
      </a>

      <button class="btn" onclick="copyClabeM(this)" type="button">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="#C9A876" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="10" width="18" height="11" rx="1"/>
          <polyline points="3 10 12 3 21 10"/>
          <line x1="8" y1="14" x2="8" y2="21"/>
          <line x1="12" y1="14" x2="12" y2="21"/>
          <line x1="16" y1="14" x2="16" y2="21"/>
        </svg>
        <span class="btn-label">
          <span class="btn-type">CLABE interbancaria BBVA</span>
          <span class="btn-value" id="clabe-mn">012180015019864949</span>
        </span>
      </button>

      <button class="btn btn-save" onclick="saveContactMN()" type="button">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="#f5f0e6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
          <path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z"/>
          <polyline points="17 21 17 13 7 13 7 21"/>
          <polyline points="7 3 7 8 15 8"/>
        </svg>
        Guardar contacto
      </button>

    </div>
  </div>

  <footer style="text-align:center;padding:20px 0 12px">
    <a href="https://www.eurekawebsites.tech/" target="_blank" rel="noopener noreferrer"
       style="font-size:0.62rem;letter-spacing:1.5px;text-transform:uppercase;color:rgba(245,240,230,0.3);text-decoration:none;transition:color 0.2s;"
       onmouseover="this.style.color='rgba(245,240,230,0.6)'"
       onmouseout="this.style.color='rgba(245,240,230,0.3)'">
      Powered by Eureka Websites
    </a>
  </footer>

  <script>
    function copyClabeM(btn) {
      navigator.clipboard.writeText('012180015019864949').then(function() {
        var el = btn.querySelector('#clabe-mn');
        var orig = el.textContent;
        el.textContent = '¡Copiado!';
        setTimeout(function() { el.textContent = orig; }, 2000);
      }).catch(function() {
        var range = document.createRange();
        range.selectNode(btn.querySelector('#clabe-mn'));
        window.getSelection().removeAllRanges();
        window.getSelection().addRange(range);
      });
    }

    function saveContactMN() {
      var vcard = [
        'BEGIN:VCARD',
        'VERSION:3.0',
        'FN:Martha Domínguez',
        'N:Domínguez;Martha;;;',
        'ORG:Mercado Negro',
        'TITLE:Repostería · Catering · Chef para eventos',
        'TEL;TYPE=CELL,VOICE:+5215517284050',
        'X-SOCIALPROFILE;type=instagram:https://www.instagram.com/mercadonegrobymarthadominguez',
        'NOTE:CLABE BBVA: 012180015019864949',
        'END:VCARD'
      ].join('\r\n');
      var blob = new Blob([vcard], { type: 'text/vcard' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'Martha-Dominguez-Mercado-Negro.vcf';
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>
